<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borders with Tailwind CSS</title>
    <link rel="stylesheet" href="./output.css">
</head>
<body>
    <div class="border m-10 w-96  p-4">
        Tailwind CSS
    </div>

     <div class="border-4 m-10 w-96 p-4">
        Tailwind CSS
    </div>

     <div class="border-blue-500 border-3 m-10 w-96 p-3">
        Tailwind CSS
    </div>

    <div class="border-t-amber-500 border-b-cyan-500 border-l-emerald-500 border-r-fuchsia-500 border-3 m-10 w-96 p-3">
        Tailwind CSS
    </div>

    <div class="border-pink-500 border-t-4 border-b-4 border-l-2 border-r-2 border-3 m-10 w-96 p-3">
        Tailwind CSS
    </div>

    <div class="border-purple-500 border-4 size-32 rounded-full m-10  p-3">
        Tailwind CSS
    </div>

    <div class="border-indigo-500 border-4 size-32 rounded-t-full m-10  p-3">
        Tailwind CSS
    </div>

    <div class="border-orange-500 border-4 size-32 rounded-b-full m-10  p-3">
        Tailwind CSS
    </div>

    <div class="border-red-500 border-4 size-32 rounded-l-full m-10  p-3">
        Tailwind CSS
    </div>

    <div class="border-green-600 border-4 size-32 rounded-r-full m-10  p-3">
        Tailwind CSS
    </div>

    <div class="border-indigo-500 border-4 size-32 rounded-br-3xl m-10  p-3">
        Tailwind CSS
    </div>

    <div class="border-pink-500 border-4 size-32 rounded-ss-full m-10  p-3">
        Tailwind CSS
    </div>

    <div class="border-b-lime-500 border-4 size-32 border-dashed rounded-t-full m-10  p-3">
        Tailwind CSS
    </div>

     <div class="border-pink-500 border-4 size-32 border-dotted rounded-ss-full m-10  p-3">
        Tailwind CSS
    </div>
</body>
</html>
