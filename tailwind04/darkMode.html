<!DOCTYPE html>
<html lang="en" id="root" class="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Mode in Tailwind CSS</title>
    <link rel="stylesheet" href="./output.css">
    <script>
        function changeMode(){
            let el = document.getElementById('root');
            if (el.className == 'dark'){
                document.getElementById('root').className= "light"
                document.getElementById('select-mode').innerText = "Apply dark mode"
            }else{
                console.log("apple");
                document.getElementById('select-mode').innerText = "Apply light mode"
                document.getElementById('root').className = "dark"

            }
            
        }
    </script>
</head>
<body>
<button id="select-mode" class="border-slate-500 m-5 p-5 rounded hover:bg-indigo-400 " onclick="changeMode()">Apply Dark Mode</button>

    <div class="dark:bg-slate-600">
        <h1 class="text-7xl dark:text-white">
            Dark mode test with Tailwind CSS
        </h1>
        <p class="text-5xl dark:text-white">Code with Mahima</p>
    </div>

    <div class="flex m-20 border border-slate-500 p-3 dark:bg-slate-500">
        <div class="bg-blue-300 size-12 dark:bg-black">

        </div>
        <p class="text-2xl ml-10 p-2 ">
            Box with Dark Mode
        </p>
    </div>
</body>
</html>
