<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All about Margin and padding with Tailwind css</title>
    <link rel="stylesheet" href="./output.css">
</head>
<body>

    <h2 class="bg-fuchsia-900 text-fuchsia-200 p-[1px] m-[5px]">Heading 2</h2>
    <!-- if we use [] bracket then it will give actual padding  -->
     <span class="bg-violet-700 text-indigo-100 ml-170  pl-10 pt-10">Span with margin and padding</span>

    <p class="bg-amber-950 text-amber-50 flex p-6 m-10 ">Tailwind CSS With Mahima</p>
    <p class="bg-blue-950 text-blue-300 flex px-24  mx-10  ">Tailwind CSS With Mahima</p>
    <p class="bg-blue-800 text-blue-200 flex py-6  my-6 ">Tailwind CSS With Mahima</p>
    <!-- px mx is for padding left, py my is for padding vertically-->
     <p class="bg-blue-700 text-blue-100 pt-5 mt-20 ">Tailwind CSS With Mahima</p>
     <!-- pt and mt fot padding and margin top -->
    <p class="bg-blue-700 text-blue-100 pl-5 ml-20 mt-10 ">Tailwind CSS With Mahima</p>
    <!-- pl and ml is for left -->
     <p class="bg-blue-700 text-blue-100 pr-5 mr-20 text-right mt-10 ">Tailwind CSS With Mahima</p>
     <!-- pr and mr is for right -->
    <p class="bg-blue-600 text-blue-100 pb-5 mb-20  m-10">Tailwind CSS With Mahima</p>
    <!-- mb and pb id for bottom -->
</body>
</html>
