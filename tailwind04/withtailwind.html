<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>How tailwind CSS work</title>
    <link rel="stylesheet" href="./output.css">
</head>
<body>
    <ul class="bg-amber-200 text-amber-800 m-0 flex text-3xl [&>*]:flex">
        <!--  //[&>*]:flex is used to apply flex property on child component no need to apply particularly on single child-->
        <li><a class="p-4 hover:bg-emerald-500" href="#home">Home</a> </li>
        <li><a class="p-4 hover:bg-emerald-500" href="#news">News</a> </li>
        <li><a class="p-4 hover:bg-emerald-500" href="#contact">Contact</a> </li>
        <li><a class="p-4 hover:bg-emerald-500" href="#about">About</a> </li>
    </ul>
</body>
</html>
