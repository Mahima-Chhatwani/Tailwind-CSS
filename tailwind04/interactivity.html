<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interacttivity with Tailwind CSS</title>
    <link rel="stylesheet" href="./output.css">
</head>
<body>
    <button class=" gradient bg-gradient-to-t to-orange-600 from-blue-500 rounded m-4 p-2  ">Login</button>
    <button class=" bg-emerald-700 hover:bg-emerald-500 m-4 p-2  hover:p-10 ">Login</button>
    <button class=" bg-emerald-700 hover:bg-emerald-500 m-4 p-2  hover:p-10 focus:bg-pink-900 ">Login</button>
    <button class=" bg-emerald-700 hover:bg-emerald-500 m-4 p-2  hover:p-10  active:bg-amber-400">Login</button>

    <!-- Group hover -->

    <div>
        <a class="group">
            <h1 class="hover:text-amber-950 group-hover:bg-amber-400"> Heading Click</h1>
            <p class="hover:text-amber-950 group-hover:bg-amber-400"> Para Click </p>
        </a>
    </div>
</body>
</html>
