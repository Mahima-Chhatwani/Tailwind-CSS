<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transition with Tailwind</title>
    <link rel="stylesheet" href="./output.css">
</head>
<body>
   <button class=" bg-emerald-400 p-2 m-10 text-white hover:bg-fuchsia-400">
    Login
   </button>

   <button class="bg-green-500 rounded hover:bg-green-800 text-white m-10 p-2 
   transition duration-1000">
    Sign up
   </button>

   <button class="bg-green-500 rounded hover:opacity-5 text-white m-10 p-2 
   transition duration-1000">
    Sign up
   </button>

   <button class="bg-red-500 rounded  text-white m-10 p-2 
   hover:rotate-30 transition-transform duration-1000">
    Sign up
   </button>

   <button class="bg-red-500 rounded  text-white m-10 p-2 
   hover:scale-30 transition-transform duration-1000">
    Sign up
   </button>
   

   <button class="bg-red-500 rounded  text-white m-10 p-2 
   hover:scale-150 transition-transform duration-1000">
    Sign up
   </button>

    <button class="bg-red-500 rounded  text-white m-10 p-2 
   hover:scale-x-150 transition-transform duration-1000">
    Sign up
   </button>

   <button class="bg-red-500 rounded  text-white m-10 p-2 
    hover:scale-x-150 hover:scale-y-80 transition-transform duration-1000">
    Sign up
   </button>

<img src="./dogimage.png" class="m-20 hover:scale-125 w-100 transition-transform duration-1000">
<img src="./dogimage.png" class="m-20 hover:rotate-90 w-100 transition-transform duration-1000">
<img src="./dogimage.png" class="m-40 hover:rotate-180 hover:scale-125 w-100 transition-transform duration-1000">

</body>
</html>
